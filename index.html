<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة المريض الراقد</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafa;
        }
        input:focus, select:focus {
            border-color: #0056b3;
            outline: none;
            background-color: #fff;
        }
        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .camera-section {
            text-align: center;
            margin-top: 20px;
            border: 2px dashed #0056b3;
            padding: 15px;
            border-radius: 8px;
            background: #f8fbff;
        }
        video, canvas {
            width: 100%;
            max-width: 100%;
            border-radius: 8px;
            display: none;
            margin-top: 10px;
        }
        img#preview {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            display: none;
            margin-top: 10px;
        }
        .btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #004085;
        }
        .btn-capture {
            background-color: #28a745;
            margin-top: 5px;
        }
        .btn-capture:hover {
            background-color: #218838;
        }
        #loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #0056b3;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>استمارة دخول المريض الراقد</h2>
    <form id="patientForm">
        
        <div class="form-group">
            <label for="fullName">الاسم الثلاثي واللقب:</label>
            <input type="text" id="fullName" required placeholder="أدخل الاسم الثلاثي">
        </div>

        <div class="form-group">
            <label for="motherName">اسم الأم:</label>
            <input type="text" id="motherName" required placeholder="أدخل اسم الأم الثلاثي">
        </div>

        <div class="form-group">
            <label for="gender">الجنس:</label>
            <select id="gender" required>
                <option value="">اختر الجنس</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
        </div>

        <div class="form-group">
            <label for="age">العمر:</label>
            <input type="number" id="age" required placeholder="أدخل العمر بالسنوات">
        </div>

        <div class="form-group">
            <label for="address">السكن (المحافظة / المنطقة):</label>
            <input type="text" id="address" required placeholder="أدخل عنوان السكن">
        </div>

        <div class="form-group">
            <label for="fileNumber">رقم الطبلة:</label>
            <input type="text" id="fileNumber" required placeholder="رقم طبلة المريض">
            <div id="fileNumberError" class="error-msg">رقم الطبلة هذا مسجل مسبقاً في النظام!</div>
        </div>

        <div class="form-group">
            <label for="phone">رقم الهاتف:</label>
            <input type="tel" id="phone" required placeholder="07xxxxxxxxx">
        </div>

        <div class="form-group">
            <label for="admissionDate">تاريخ ودخول المريض:</label>
            <input type="date" id="admissionDate" required>
        </div>

        <div class="camera-section">
            <label>صورة المريض / الحالة (من الهاتف):</label>
            <button type="button" class="btn btn-capture" id="startCamera">فتح الكاميرا لالتقاط صورة</button>
            <video id="video" autoplay playsinline></video>
            <button type="button" class="btn" id="captureBtn" style="display:none;">التقاط الصورة</button>
            <canvas id="canvas"></canvas>
            <img id="preview" alt="معاينة الصورة">
            <input type="hidden" id="imageData">
        </div>

        <button type="submit" class="btn" style="margin-top: 20px;">حفظ وإرسال البيانات</button>
        <div id="loading">جاري فحص البيانات وإرسالها، يرجى الانتظار...</div>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxktTx_NV4sBfO5DHAKpJKLQABPIQWnNxc2LL76vkTLPDQtc0vgyJ8ISHKRVUqyhySLSQ/exec'; // ضع رابط سكربت قوقل هنا

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const startCameraBtn = document.getElementById('startCamera');
    const captureBtn = document.getElementById('captureBtn');
    const imageDataInput = document.getElementById('imageData');
    const fileNumberInput = document.getElementById('fileNumber');
    const fileNumberError = document.getElementById('fileNumberError');
    let streamInstance = null;

    // إخفاء رسالة الخطأ عند كتابة رقم جديد
    fileNumberInput.addEventListener('input', () => {
        fileNumberError.style.display = 'none';
        fileNumberInput.style.borderColor = '#ccc';
    });

    // تشغيل الكاميرا المباشرة من الهاتف
    startCameraBtn.addEventListener('click', async () => {
        try {
            streamInstance = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' }, 
                audio: false 
            });
            video.srcObject = streamInstance;
            video.style.display = 'block';
            captureBtn.style.display = 'block';
            startCameraBtn.style.display = 'none';
        } catch (err) {
            alert('تعذر الوصول إلى كاميرا الهاتف. تأكد من إعطاء الصلاحيات.');
            console.error(err);
        }
    });

    // التقاط الصورة من الفيديو
    captureBtn.addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const dataURL = canvas.toDataURL('image/jpeg', 0.8);
        imageDataInput.value = dataURL;
        preview.src = dataURL;
        preview.style.display = 'block';

        if (streamInstance) {
            streamInstance.getTracks().forEach(track => track.stop());
        }
        video.style.display = 'none';
        captureBtn.style.display = 'none';
        startCameraBtn.style.display = 'block';
        startCameraBtn.textContent = 'إعادة التقاط الصورة';
    });

    // إرسال البيانات والتحقق من التكرار
    const form = document.getElementById('patientForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        
        if (!imageDataInput.value) {
            alert('يرجى التقاط صورة المريض أولاً.');
            return;
        }

        document.getElementById('loading').style.display = 'block';

        const data = {
            fullName: document.getElementById('fullName').value,
            motherName: document.getElementById('motherName').value,
            gender: document.getElementById('gender').value,
            age: document.getElementById('age').value,
            address: document.getElementById('address').value,
            fileNumber: fileNumberInput.value,
            phone: document.getElementById('phone').value,
            admissionDate: document.getElementById('admissionDate').value,
            image: imageDataInput.value
        };

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(response => {
            document.getElementById('loading').style.display = 'none';
            
            if (response.result === 'duplicate') {
                fileNumberError.style.display = 'block';
                fileNumberInput.style.borderColor = '#dc3545';
                fileNumberInput.focus();
            } else if (response.result === 'success') {
                alert('تم حفظ البيانات بنجاح!');
                form.reset();
                preview.style.display = 'none';
                imageDataInput.value = '';
                fileNumberError.style.display = 'none';
                fileNumberInput.style.borderColor = '#ccc';
            } else {
                alert('حدث خطأ غير متوقع.');
            }
        })
        .catch(error => {
            document.getElementById('loading').style.display = 'none';
            alert('حدث خطأ أثناء الاتصال بالخادم. يرجى المحاولة مرة أخرى.');
            console.error('Error!', error.message);
        });
    });
</script>

</body>
</html>
